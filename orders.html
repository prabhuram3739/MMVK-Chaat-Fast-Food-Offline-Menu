
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMVK Staff Order Board</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#181818;
  border-bottom:1px solid #333;
  padding:14px;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  margin:0;
  font-size:21px;
}

.subtitle{
  color:#aaa;
  font-size:12px;
  margin-top:4px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  font-weight:bold;
  cursor:pointer;
}

.refresh{
  background:#fff;
  color:#111;
}

.login{
  max-width:420px;
  margin:70px auto;
  padding:20px;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:16px;
}

.login h2{
  margin-top:0;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #444;
  background:#111;
  color:#fff;
  font-size:15px;
}

.login button{
  width:100%;
  margin-top:8px;
  background:#f5f5f5;
  color:#111;
}

.error{
  color:#ff7777;
  font-size:13px;
  margin-top:8px;
}

#app{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:12px;
}

.stat{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:12px;
  padding:11px;
  text-align:center;
}

.stat-number{
  font-size:22px;
  font-weight:bold;
}

.stat-label{
  color:#999;
  font-size:11px;
  margin-top:3px;
}

.filters{
  padding:0 12px 12px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.filter{
  white-space:nowrap;
  background:#222;
  color:#ddd;
  border:1px solid #444;
}

.filter.active{
  background:#fff;
  color:#111;
}

.orders{
  padding:0 12px 25px;
  display:grid;
  gap:12px;
}

.empty{
  text-align:center;
  color:#888;
  padding:50px 20px;
}

.order{
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:15px;
  overflow:hidden;
}

.order.new{
  border-color:#fff;
}

.order-head{
  padding:13px;
  border-bottom:1px solid #333;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.order-number{
  font-size:18px;
  font-weight:bold;
}

.time{
  color:#aaa;
  font-size:12px;
  margin-top:4px;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  background:#333;
  white-space:nowrap;
}

.status.NEW{background:#fff;color:#111}
.status.ACCEPTED{background:#444}
.status.PREPARING{background:#664d00}
.status.READY{background:#164d28}
.status.COMPLETED{background:#263b2d}
.status.CANCELLED{background:#5b2222}

.customer{
  padding:12px;
  border-bottom:1px solid #333;
}

.customer-name{
  font-weight:bold;
  font-size:16px;
}

.customer-phone{
  color:#bbb;
  margin-top:4px;
}

.customer-note{
  margin-top:8px;
  background:#111;
  padding:8px;
  border-radius:8px;
  font-size:13px;
}

.items{
  padding:12px;
  border-bottom:1px solid #333;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
}

.item-name{
  flex:1;
}

.item-qty{
  color:#aaa;
  min-width:35px;
}

.item-price{
  min-width:65px;
  text-align:right;
}

.total{
  display:flex;
  justify-content:space-between;
  padding:13px;
  font-size:18px;
  font-weight:bold;
}

.payment{
  padding:0 13px 12px;
  color:#bbb;
  font-size:13px;
}

.payment.paid{
  color:#75e39a;
  font-weight:bold;
}

.actions{
  padding:12px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  background:#151515;
}

.actions button{
  flex:1;
  min-width:120px;
  background:#333;
  color:#fff;
}

.actions button.primary{
  background:#fff;
  color:#111;
}

.actions button.danger{
  background:#5b2222;
}

.actions button.green{
  background:#164d28;
}

@media(max-width:650px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .order-head{
    align-items:flex-start;
  }

  .actions button{
    min-width:45%;
  }
}

@media(min-width:900px){
  .orders{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div id="loginBox" class="login">
  <h2>🔐 MMVK Staff Order Board</h2>
  <div class="subtitle">
    Enter the staff access key to continue.
  </div>

  <input
    id="keyInput"
    type="password"
    placeholder="Staff access key"
    autocomplete="off"
  >

  <button onclick="login()">Open Order Board</button>

  <div id="loginError" class="error"></div>
</div>


<div id="app">

<header>
  <div class="header-row">
    <div>
      <h1>🍽️ MMVK Order Board</h1>
      <div class="subtitle">
        Online orders • Pollachi
      </div>
    </div>

    <button class="refresh" onclick="loadOrders()">
      ↻ Refresh
    </button>
  </div>
</header>


<div class="stats">

  <div class="stat">
    <div id="newCount" class="stat-number">0</div>
    <div class="stat-label">NEW</div>
  </div>

  <div class="stat">
    <div id="acceptedCount" class="stat-number">0</div>
    <div class="stat-label">ACCEPTED</div>
  </div>

  <div class="stat">
    <div id="preparingCount" class="stat-number">0</div>
    <div class="stat-label">PREPARING</div>
  </div>

  <div class="stat">
    <div id="readyCount" class="stat-number">0</div>
    <div class="stat-label">READY</div>
  </div>

</div>


<div class="filters">

  <button class="filter active" onclick="setFilter('ALL',this)">
    All
  </button>

  <button class="filter" onclick="setFilter('NEW',this)">
    New
  </button>

  <button class="filter" onclick="setFilter('ACCEPTED',this)">
    Accepted
  </button>

  <button class="filter" onclick="setFilter('PREPARING',this)">
    Preparing
  </button>

  <button class="filter" onclick="setFilter('READY',this)">
    Ready
  </button>

  <button class="filter" onclick="setFilter('COMPLETED',this)">
    Completed
  </button>

  <button class="filter" onclick="setFilter('CANCELLED',this)">
    Cancelled
  </button>

</div>


<div id="orders" class="orders">
  <div class="empty">
    Loading orders...
  </div>
</div>

</div>


<script>

const API =
  "https://mmvk-loyverse-api.prabhuram3739.workers.dev";

let staffKey =
  sessionStorage.getItem("MMVK_ORDER_BOARD_KEY") || "";

let currentFilter = "ALL";

let previousNewOrders = new Set();


// ---------------------------------------------------------
// LOGIN
// ---------------------------------------------------------

function login(){

  const key =
    document.getElementById("keyInput").value.trim();

  if(!key){
    document.getElementById("loginError").textContent =
      "Please enter the staff key.";

    return;
  }

  staffKey = key;

  sessionStorage.setItem(
    "MMVK_ORDER_BOARD_KEY",
    key
  );

  verifyAccess();

}


async function verifyAccess(){

  try{

    const response =
      await fetch(
        API + "/orders",
        {
          headers:{
            "Authorization":
              "Bearer " + staffKey
          }
        }
      );

    if(response.status === 401){

      document.getElementById("loginError").textContent =
        "Invalid staff key.";

      sessionStorage.removeItem(
        "MMVK_ORDER_BOARD_KEY"
      );

      staffKey = "";

      return;
    }

    if(!response.ok){

      document.getElementById("loginError").textContent =
        "Unable to connect to order server.";

      return;
    }

    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("app").style.display =
      "block";

    loadOrders();

  }catch(error){

    document.getElementById("loginError").textContent =
      "Connection error. Please try again.";

  }

}


// ---------------------------------------------------------
// LOAD ORDERS
// ---------------------------------------------------------

async function loadOrders(){

  const container =
    document.getElementById("orders");

  try{

    const response =
      await fetch(
        API + "/orders",
        {
          headers:{
            "Authorization":
              "Bearer " + staffKey
          }
        }
      );

    if(response.status === 401){

      logout();
      return;

    }

    const data =
      await response.json();

    const orders =
      Array.isArray(data)
        ? data
        : (data.orders || []);

    updateStats(orders);

    renderOrders(orders);

    detectNewOrders(orders);

  }catch(error){

    container.innerHTML =
      `<div class="empty">
        Unable to load orders.<br>
        Please tap Refresh.
      </div>`;

  }

}


// ---------------------------------------------------------
// STATS
// ---------------------------------------------------------

function updateStats(orders){

  const count =
    status =>
      orders.filter(
        o => String(o.status || "").toUpperCase() === status
      ).length;

  document.getElementById("newCount").textContent =
    count("NEW");

  document.getElementById("acceptedCount").textContent =
    count("ACCEPTED");

  document.getElementById("preparingCount").textContent =
    count("PREPARING");

  document.getElementById("readyCount").textContent =
    count("READY");

}


// ---------------------------------------------------------
// RENDER
// ---------------------------------------------------------

function renderOrders(orders){

  const container =
    document.getElementById("orders");

  let filtered =
    orders.filter(o => {

      const status =
        String(o.status || "").toUpperCase();

      if(currentFilter === "ALL")
        return true;

      return status === currentFilter;

    });

  filtered.sort(
    (a,b) =>
      new Date(b.created_at || 0) -
      new Date(a.created_at || 0)
  );

  if(!filtered.length){

    container.innerHTML =
      `<div class="empty">
        No ${currentFilter === "ALL"
          ? ""
          : currentFilter.toLowerCase() + " "
        }orders.
      </div>`;

    return;
  }

  container.innerHTML =
    filtered.map(renderOrder).join("");

}


// ---------------------------------------------------------
// ORDER CARD
// ---------------------------------------------------------

function renderOrder(order){

  const status =
    String(order.status || "NEW").toUpperCase();

  const items =
    parseItems(order.items);

  const total =
    Number(
      order.total_amount ??
      order.total ??
      0
    );

  const customerName =
    escapeHtml(
      order.customer_name ||
      order.customerName ||
      "Customer"
    );

  const phone =
    escapeHtml(
      order.customer_phone ||
      order.customerPhone ||
      ""
    );

  const note =
    escapeHtml(
      order.note ||
      order.customer_note ||
      ""
    );

  const orderNumber =
    escapeHtml(
      order.order_number ||
      order.orderNumber ||
      "Order"
    );

  const created =
    formatDate(
      order.created_at ||
      order.createdAt
    );

  const paymentStatus =
    String(
      order.payment_status ||
      order.paymentStatus ||
      "PENDING"
    ).toUpperCase();

  const paymentMethod =
    escapeHtml(
      order.payment_method ||
      order.paymentMethod ||
      ""
    );


  const itemHtml =
    items.map(item => {

      const name =
        escapeHtml(
          item.name ||
          item.item_name ||
          item.title ||
          "Item"
        );

      const qty =
        Number(
          item.quantity ||
          item.qty ||
          1
        );

      const price =
        Number(
          item.price ||
          item.unit_price ||
          0
        );

      return `
        <div class="item">
          <div class="item-name">${name}</div>
          <div class="item-qty">×${qty}</div>
          <div class="item-price">
            ₹${formatMoney(price * qty)}
          </div>
        </div>
      `;

    }).join("");


  return `
    <div class="order ${status === "NEW" ? "new" : ""}">

      <div class="order-head">

        <div>
          <div class="order-number">
            ${orderNumber}
          </div>

          <div class="time">
            ${created}
          </div>
        </div>

        <div class="status ${status}">
          ${status}
        </div>

      </div>


      <div class="customer">

        <div class="customer-name">
          👤 ${customerName}
        </div>

        ${
          phone
            ? `<div class="customer-phone">
                📞 ${phone}
              </div>`
            : ""
        }

        ${
          note
            ? `<div class="customer-note">
                📝 ${note}
              </div>`
            : ""
        }

      </div>


      <div class="items">
        ${itemHtml || `
          <div class="item">
            <div class="item-name">
              Order items unavailable
            </div>
          </div>
        `}
      </div>


      <div class="total">
        <span>Total</span>
        <span>₹${formatMoney(total)}</span>
      </div>


      <div class="payment ${
        paymentStatus === "PAID" ? "paid" : ""
      }">

        ${
          paymentStatus === "PAID"
            ? "✓ PAID"
            : "○ PAYMENT PENDING"
        }

        ${
          paymentMethod
            ? " • " + paymentMethod
            : ""
        }

      </div>


      <div class="actions">

        ${actionButtons(order, status)}

      </div>

    </div>
  `;

}


// ---------------------------------------------------------
// ACTION BUTTONS
// ---------------------------------------------------------

function actionButtons(order,status){

  const id =
    escapeHtml(
      order.order_number ||
      order.orderNumber ||
      ""
    );


  let buttons = "";


  if(status === "NEW"){

    buttons += `
      <button
        class="primary"
        onclick="changeStatus('${id}','ACCEPTED')">
        ✓ Accept
      </button>
    `;

  }


  if(status === "ACCEPTED"){

    buttons += `
      <button
        class="primary"
        onclick="changeStatus('${id}','PREPARING')">
        👨‍🍳 Start Preparing
      </button>
    `;

  }


  if(status === "PREPARING"){

    buttons += `
      <button
        class="green"
        onclick="changeStatus('${id}','READY')">
        📦 Mark Ready
      </button>
    `;

  }


  if(status === "READY"){

    buttons += `
      <button
        class="green"
        onclick="changeStatus('${id}','COMPLETED')">
        ✓ Completed
      </button>
    `;

  }


  if(
    status !== "COMPLETED" &&
    status !== "CANCELLED"
  ){

    buttons += `
      <button
        class="danger"
        onclick="cancelOrder('${id}')">
        ✕ Cancel
      </button>
    `;

  }


  if(
    status !== "CANCELLED" &&
    String(
      order.payment_status ||
      order.paymentStatus ||
      "PENDING"
    ).toUpperCase() !== "PAID"
  ){

    buttons += `
      <button
        onclick="markPaid('${id}')">
        💰 Mark Paid
      </button>
    `;

  }


  return buttons;

}


// ---------------------------------------------------------
// STATUS UPDATE
// ---------------------------------------------------------

async function changeStatus(orderNumber,status){

  if(!orderNumber)
    return;


  try{

    const response =
      await fetch(
        API +
        "/order/" +
        encodeURIComponent(orderNumber),
        {
          method:"PATCH",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + staffKey
          },

          body:JSON.stringify({
            status:status
          })
        }
      );


    if(response.status === 401){

      logout();
      return;

    }


    if(!response.ok){

      const text =
        await response.text();

      alert(
        "Unable to update order.\n" +
        text
      );

      return;

    }


    await loadOrders();

  }catch(error){

    alert(
      "Connection error while updating order."
    );

  }

}


// ---------------------------------------------------------
// CANCEL
// ---------------------------------------------------------

async function cancelOrder(orderNumber){

  const ok =
    confirm(
      "Cancel order " +
      orderNumber +
      "?"
    );

  if(!ok)
    return;

  await changeStatus(
    orderNumber,
    "CANCELLED"
  );

}


// ---------------------------------------------------------
// MARK PAID
// ---------------------------------------------------------

async function markPaid(orderNumber){

  const method =
    prompt(
      "Payment method?\n\n" +
      "Example: GPay, Cash, UPI, Card",
      "UPI"
    );

  if(method === null)
    return;


  const cleanMethod =
    method.trim() || "UPI";


  try{

    const response =
      await fetch(
        API +
        "/order/" +
        encodeURIComponent(orderNumber),
        {
          method:"PATCH",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + staffKey
          },

          body:JSON.stringify({
            payment_status:"PAID",
            payment_method:cleanMethod
          })
        }
      );


    if(response.status === 401){

      logout();
      return;

    }


    if(!response.ok){

      const text =
        await response.text();

      alert(
        "Unable to mark payment.\n" +
        text
      );

      return;

    }


    alert(
      "Payment marked as PAID.\n\n" +
      "Loyverse receipt creation will be handled by the Worker."
    );


    await loadOrders();

  }catch(error){

    alert(
      "Connection error while marking payment."
    );

  }

}


// ---------------------------------------------------------
// FILTER
// ---------------------------------------------------------

function setFilter(filter,button){

  currentFilter =
    filter;


  document
    .querySelectorAll(".filter")
    .forEach(
      b => b.classList.remove("active")
    );


  if(button)
    button.classList.add("active");


  loadOrders();

}


// ---------------------------------------------------------
// NEW ORDER DETECTION
// ---------------------------------------------------------

function detectNewOrders(orders){

  const currentNew =
    new Set(
      orders
        .filter(
          o =>
            String(o.status || "").toUpperCase()
            === "NEW"
        )
        .map(
          o =>
            o.order_number ||
            o.orderNumber
        )
    );


  let hasNew =
    false;


  currentNew.forEach(id => {

    if(
      previousNewOrders.size &&
      !previousNewOrders.has(id)
    ){

      hasNew = true;

    }

  });


  previousNewOrders =
    currentNew;


  if(hasNew){

    try{
      playAlert();
    }catch(e){}

  }

}


// ---------------------------------------------------------
// SOUND
// ---------------------------------------------------------

function playAlert(){

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext)
    return;


  const ctx =
    new AudioContext();

  const oscillator =
    ctx.createOscillator();

  const gain =
    ctx.createGain();


  oscillator.connect(gain);
  gain.connect(ctx.destination);


  oscillator.frequency.value =
    880;

  gain.gain.value =
    0.08;


  oscillator.start();

  setTimeout(
    () => oscillator.stop(),
    250
  );

}


// ---------------------------------------------------------
// HELPERS
// ---------------------------------------------------------

function parseItems(items){

  if(Array.isArray(items))
    return items;


  if(typeof items === "string"){

    try{

      const parsed =
        JSON.parse(items);

      if(Array.isArray(parsed))
        return parsed;

    }catch(e){}

  }


  return [];

}


function formatMoney(value){

  return Number(value || 0)
    .toLocaleString("en-IN");
}


function formatDate(value){

  if(!value)
    return "";

  const d =
    new Date(value);

  if(isNaN(d.getTime()))
    return String(value);


  return d.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function logout(){

  sessionStorage.removeItem(
    "MMVK_ORDER_BOARD_KEY"
  );

  staffKey = "";

  document.getElementById("app").style.display =
    "none";

  document.getElementById("loginBox").style.display =
    "block";

}


// ---------------------------------------------------------
// AUTO REFRESH
// ---------------------------------------------------------

setInterval(
  () => {

    if(
      staffKey &&
      document.getElementById("app").style.display !== "none"
    ){

      loadOrders();

    }

  },
  15000
);


// ---------------------------------------------------------
// ENTER KEY LOGIN
// ---------------------------------------------------------

document
  .getElementById("keyInput")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter")
        login();

    }
  );


// ---------------------------------------------------------
// AUTO LOGIN IF KEY EXISTS
// ---------------------------------------------------------

if(staffKey){

  verifyAccess();

}

</script>

</body>
</html>
